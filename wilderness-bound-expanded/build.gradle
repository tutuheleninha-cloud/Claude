plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and library repositories automatically.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"wilderness" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Server game tests run as part of `check`; client game tests (screenshots) run with `runClientGameTest`.
	configureTests {
		createSourceSet = true
		modId = "wilderness-gametest"
		eula = true
		clearRunDirectory = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.base.archivesName.get()
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

// Used by CI (ci/reference-dump.sh) to locate the Minecraft jars for API reference dumps.
tasks.register("printClientClasspath") {
	def cp = sourceSets.client.compileClasspath
	doLast {
		cp.files.each { println "CP " + it.absolutePath }
	}
}
